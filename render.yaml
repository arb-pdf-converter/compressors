services:
  - type: web
    name: pdf-compressor-service
    env: node
    buildCommand: |
      apt-get update -qq > /dev/null
      apt-get install -y ghostscript
      npm ci --only=production
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: pdf-storage
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
